
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patel Generator | Login</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;background:#07111f;color:white;
 font-family:Arial,sans-serif;padding:20px
}
.login{
 width:100%;max-width:390px;background:#101e30;
 padding:35px;border:1px solid #263d56;border-radius:18px;
 box-shadow:0 15px 50px #0008
}
.logo{font-size:34px;text-align:center;margin-bottom:10px}
h2{text-align:center;margin:0 0 8px}
p{text-align:center;color:#8da6c1;margin-bottom:28px}
label{display:block;margin:15px 0 8px;color:#c8d9eb}
input{
 width:100%;padding:14px;background:#071525;color:white;
 border:1px solid #34516d;border-radius:9px;outline:none
}
input:focus{border-color:#00c8ff}
button{
 width:100%;padding:14px;margin-top:23px;border:0;
 border-radius:9px;background:#00bce8;color:#00121d;
 font-size:16px;font-weight:bold;cursor:pointer
}
button:hover{background:#42d6fa}
.error{color:#ff8585;text-align:center;margin-top:15px}
small{display:block;text-align:center;color:#6f89a5;margin-top:25px}
</style>
</head>
<body>
<div class="login">
 <div class="logo">⚡</div>
 <h2>PATEL GENERATOR</h2>
 <p>ERP Management System</p>

 <form method="POST">
  <label>Username</label>
  <input name="username" placeholder="Enter username" required>

  <label>Password</label>
  <input type="password" name="password"
         placeholder="Enter password" required>

  <button type="submit">LOGIN →</button>
 </form>

 {% with messages = get_flashed_messages() %}
  {% for message in messages %}
   <div class="error">{{ message }}</div>
  {% endfor %}
 {% endwith %}

 <small>SECURE ADMIN ACCESS</small>
</div>
</body>
</html>
