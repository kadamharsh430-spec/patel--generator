
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent Generator | Patel Generator</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;padding:20px;background:#07111f;
    color:#eaf6ff;font-family:Arial,sans-serif
}
.container{max-width:750px;margin:auto}
.card{
    background:#102238;border:1px solid #29445d;
    padding:25px;border-radius:15px;margin-top:20px
}
h1{color:#00d9ff}
h3{color:#00d9ff}
label{display:block;color:#b8cce0;margin:15px 0 7px}
input,select,textarea{
    width:100%;padding:12px;background:#071827;
    border:1px solid #31516c;border-radius:8px;
    color:white;font-size:15px
}
textarea{min-height:90px;resize:vertical}
button{
    width:100%;padding:14px;margin-top:20px;
    background:#f59e0b;color:#111827;border:0;
    border-radius:8px;font-weight:bold;cursor:pointer
}
a{color:#00d9ff;text-decoration:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.note{color:#94a3b8;font-size:13px}
@media(max-width:550px){.row{grid-template-columns:1fr}.card{padding:17px}}
</style>
</head>

<body>
<div class="container">
<a href="{{ url_for('records') }}">← Back to Records</a>

<div class="card">
<h1>RENT GENERATOR</h1>
<p class="note">Generator #{{ genset.id }} | {{ genset.company or '-' }} {{ genset.model or '' }} | {{ genset.kva or '-' }} KVA</p>

<form method="POST">

<h3>Renter Information</h3>

<label>Customer / Renter Name *</label>
<input type="text" name="renter_name" required>

<label>Mobile Number</label>
<input type="text" name="renter_mobile">

<label>Address</label>
<textarea name="renter_address"></textarea>

<h3>Rental Details</h3>

<div class="row">
<div>
<label>Rate Type *</label>
<select name="rate_type" required>
<option value="DAILY">Daily</option>
<option value="MONTHLY">Monthly</option>
<option value="YEARLY">Yearly</option>
</select>
</div>

<div>
<label>Rent Rate (₹) *</label>
<input type="number" name="rate" min="0.01" step="0.01" required>
</div>
</div>

<div class="row">
<div>
<label>Rental Start Date *</label>
<input type="date" name="start_date" required>
</div>

<div>
<label>Expected Return Date</label>
<input type="date" name="expected_return_date">
</div>
</div>

<div class="row">
<div>
<label>Advance Amount (₹)</label>
<input type="number" name="advance" min="0" step="0.01" value="0">
</div>

<div>
<label>Already Paid Amount (₹)</label>
<input type="number" name="paid_amount" min="0" step="0.01" value="0">
</div>
</div>

<label>Notes</label>
<textarea name="notes" placeholder="Extra details..."></textarea>

<p class="note">
Generator rent par jaane ke baad uska status ON RENT ho jayega.
</p>

<button type="submit">CONFIRM RENTAL</button>

</form>
</div>
</div>
</body>
</html>
