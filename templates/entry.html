
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genset Entry | Patel Generator</title>
<style>
body{background:#07111f;color:white;font-family:Arial;padding:25px}
.container{max-width:850px;margin:auto;background:#102238;padding:25px;border-radius:15px}
h1{color:#00d9ff}
h3{color:#00d9ff;margin-top:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
input,textarea,select{width:100%;padding:13px;box-sizing:border-box;background:#071827;border:1px solid #31516c;color:white;border-radius:7px}
textarea{min-height:80px}
button{background:#00d9ff;border:0;padding:14px 25px;font-weight:bold;border-radius:8px;cursor:pointer;margin-top:20px}
a{color:#00d9ff}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>PATEL GENERATOR</h1>
<h2>New Genset Entry</h2>
<form method="POST">
<h3>Customer Details</h3>
<div class="grid">
<input name="customer" placeholder="Customer Name" required>
<input name="mobile" placeholder="Mobile Number">
</div>
<p><textarea name="address" placeholder="Full Address"></textarea></p>

<h3>Generator Details</h3>
<div class="grid">
<input name="company" placeholder="Generator Company">
<input name="model" placeholder="Model">
<input name="serial" placeholder="Serial Number">
<input name="kva" placeholder="KVA">
</div>

<h3>Workshop Details</h3>
<p><textarea name="complaint" placeholder="Customer Complaint"></textarea></p>
<div class="grid">
<select name="work">
<option>Repair</option>
<option>Service</option>
<option>Oil Change</option>
<option>Maintenance</option>
<option>Other</option>
</select>
<input name="amount" type="number" step="0.01" min="0" placeholder="Estimated Amount ₹">
</div>

<button type="submit">SAVE GENSET ENTRY</button>
</form>
<p><a href="/">← Dashboard</a></p>
</div>
</body>
</html>
