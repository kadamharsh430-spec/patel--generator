
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patel Generator | Entry</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#e8f0ff;font-family:Arial,sans-serif;padding:25px}
.container{max-width:900px;margin:auto;background:#111c30;border:1px solid #26364e;border-radius:16px;padding:25px}
h1{font-size:23px}
p{color:#8292ad;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:25px}
.field label{display:block;font-size:12px;color:#9aabc5;margin-bottom:8px}
input,textarea,select{width:100%;padding:13px;border:1px solid #2a3c56;border-radius:8px;background:#091426;color:white;outline:none}
input:focus,textarea:focus,select:focus{border-color:#00d5ff}
textarea{resize:vertical;min-height:80px}
.full{grid-column:1/-1}
.buttons{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
button,.back{border:0;padding:13px 20px;border-radius:8px;font-weight:bold;cursor:pointer;text-decoration:none;font-size:13px}
button{background:#00d5ff;color:#00121b}
.back{background:#25344b;color:white}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}body{padding:12px}.container{padding:18px}}
</style>
</head>

<body>
<div class="container">

<h1>
{% if record %}EDIT GENERATOR ENTRY{% else %}NEW GENERATOR ENTRY{% endif %}
</h1>

<p>Patel Generator Management System</p>

<form method="POST"
action="{% if record %}{{ url_for('edit_entry', id=record.id) }}{% else %}{{ url_for('entry') }}{% endif %}">

<div class="grid">

<div class="field">
<label>Customer Name *</label>
<input name="customer" required value="{{ record.customer if record else '' }}">
</div>

<div class="field">
<label>Mobile Number</label>
<input name="mobile" value="{{ record.mobile if record else '' }}">
</div>

<div class="field full">
<label>Address</label>
<textarea name="address">{{ record.address if record else '' }}</textarea>
</div>

<div class="field">
<label>Company</label>
<input name="company" value="{{ record.company if record else '' }}">
</div>

<div class="field">
<label>Generator Model</label>
<input name="model" value="{{ record.model if record else '' }}">
</div>

<div class="field">
<label>Serial Number</label>
<input name="serial" value="{{ record.serial if record else '' }}">
</div>

<div class="field">
<label>KVA</label>
<input name="kva" value="{{ record.kva if record else '' }}" placeholder="Example: 25 KVA">
</div>

<div class="field">
<label>Work Type</label>
{% set selected_work = record.work if record else '' %}
<select name="work">
<option value="">Select Work</option>
{% for work in ['Repair','Service','Oil Change','Maintenance','Installation','Other'] %}
<option value="{{ work }}" {% if selected_work == work %}selected{% endif %}>{{ work }}</option>
{% endfor %}
</select>
</div>

<div class="field">
<label>Amount (₹)</label>
<input type="number" step="0.01" min="0" name="amount" value="{{ record.amount if record else '0' }}">
</div>

<div class="field full">
<label>Problem / Complaint</label>
<textarea name="complaint">{{ record.complaint if record else '' }}</textarea>
</div>

{% if record %}

<div class="field">
<label>Entry Date & Time</label>
<input type="datetime-local" name="entry_date"
value="{{ record.entry_date.strftime('%Y-%m-%dT%H:%M') if record.entry_date else '' }}" required>
</div>

<div class="field">
<label>Delivery Date & Time</label>
<input type="datetime-local" name="exit_date"
value="{{ record.exit_date.strftime('%Y-%m-%dT%H:%M') if record.exit_date else '' }}">
</div>

<div class="field">
<label>Generator Status</label>
<select name="status">
<option value="IN SHOP" {% if record.status == 'IN SHOP' %}selected{% endif %}>IN SHOP</option>
<option value="DELIVERED" {% if record.status == 'DELIVERED' %}selected{% endif %}>DELIVERED</option>
</select>
</div>

<div class="field">
<label>Delivered To</label>
<input name="delivered_to" value="{{ record.delivered_to or '' }}">
</div>

{% endif %}

</div>

<div class="buttons">

<button type="submit">
{% if record %}UPDATE GENERATOR{% else %}SAVE ENTRY{% endif %}
</button>

<a class="back" href="{{ url_for('records') }}">BACK TO RECORDS</a>

</div>
</form>
</div>
</body>
</html>
